<div class="modal-overlay fade-in" (click)="closeModal()">
    <div class="modal-content" (click)="stopPropagation($event)">

        <span class="close-btn" (click)="closeModal()">&times;</span>

        <div class="modal-header">
            <h2>{{ service ? 'Edit Service' : 'Add New Service' }}</h2>
            <p>{{ service ? 'Update the details for this beauty service.' : 'Create a brand new beauty service entry.'
                }}</p>
        </div>

        <form class="admin-form" (ngSubmit)="submitForm()">
            <div class="form-group">
                <label for="name">Service Name *</label>
                <input type="text" id="name" name="name" [(ngModel)]="formData.name" required
                    placeholder="e.g. Deep Cleansing Facial">
            </div>

            <div class="form-row">
                <div class="form-group half">
                    <label for="price">Price (GEL) *</label>
                    <input type="number" id="price" name="price" [(ngModel)]="formData.price" required min="1">
                </div>
                <div class="form-group half">
                    <label for="rating">Initial Rating</label>
                    <input type="number" id="rating" name="rating" [(ngModel)]="formData.rating" min="1" max="5"
                        step="0.1">
                </div>
            </div>

            <div class="form-group">
                <label for="image">Image URL</label>
                <input type="text" id="image" name="image" [(ngModel)]="formData.image"
                    placeholder="https://example.com/image.jpg (Optional)">
                <small>Leave blank to use the default Lunara Beauty category image.</small>
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" name="description" [(ngModel)]="formData.description" rows="4"
                    placeholder="Describe the service details and benefits..."></textarea>
            </div>

            <div class="modal-actions">
                <button type="button" class="btn btn-outline" (click)="closeModal()">Cancel</button>
                <button type="submit" class="btn btn-primary" style="margin-top: 0;">{{ service ? 'Save Changes' :
                    'Create Service' }}</button>
            </div>
        </form>

    </div>
</div>
