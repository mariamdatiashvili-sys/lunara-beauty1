<div class="cart-overlay" [class.active]="isOpen()" (click)="close()"></div>

<div class="cart-sidebar" [class.open]="isOpen()">
    <div class="cart-header">
        <h3 style="display: flex; align-items: center; gap: 10px;">
            <i class="fas fa-heart"></i> Your Favorites
        </h3>
        <span class="close-btn" (click)="close()" style="font-size: 30px; cursor: pointer;">&times;</span>
    </div>

    <div class="cart-items">
        @if (favorites().length === 0) {
        <div style="text-align: center; padding: 40px 20px; color: #888;">
            <i class="fas fa-heart-broken" style="font-size: 3rem; color: #e8dada; margin-bottom: 20px;"></i>
            <p>You haven't saved any favorites yet.</p>
            <button class="btn btn-primary" (click)="viewServices()" style="margin-top: 20px;">Browse Services</button>
        </div>
        } @else {
        @for (item of favorites(); track $index) {
        <div class="cart-item"
            style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px solid #f9f9f9;">
            <div style="display: flex; align-items: center; gap: 15px;">
                @if (item.image) {
                <img [src]="item.image" alt="{{item.name}}"
                    style="width: 50px; height: 50px; object-fit: cover; border-radius: 8px;">
                }
                <div class="item-info">
                    <h4 style="margin: 0 0 5px 0; font-size: 1rem; color: #333;">{{ item.name }}</h4>
                    <p style="margin: 0 0 8px 0; color: #888; font-size: 0.9rem;">GEL {{ item.price }}</p>
                    <button (click)="addToCart(item)"
                        style="background: #e2aeb3; color: white; border: none; padding: 5px 12px; border-radius: 15px; font-size: 0.8rem; cursor: pointer; transition: background 0.3s; display: flex; align-items: center; gap: 5px;"
                        onmouseover="this.style.background='#c88b8b'" onmouseout="this.style.background='#e2aeb3'">
                        <i class="fas fa-shopping-cart" style="font-size: 0.75rem;"></i> Add to Cart
                    </button>
                </div>
            </div>
            <button class="remove-btn" (click)="remove(item.id)"
                style="color: #ff4d4d; font-size: 20px; background: none; cursor: pointer; border: none;"
                title="Remove favorite">&times;</button>
        </div>
        }
        }
    </div>
</div>
