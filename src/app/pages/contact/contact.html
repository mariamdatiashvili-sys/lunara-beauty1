<!-- Contact Section -->
<section class="contact-section">
    <div class="contact-container">
        <div class="contact-image">
            <img src="assets/images/contact.png" alt="Lunara Beauty Contact Room">
        </div>

        <div class="contact-form">
            <h2>Get in Touch</h2>
            <p>We are here to answer any questions you may have about our services. Reach out using the form below,
                and we’ll respond as soon as possible.</p>

            <form>
                <div class="form-row">
                    <div class="form-group">
                        <label>First name *</label>
                        <input type="text" required>
                    </div>
                    <div class="form-group">
                        <label>Last name *</label>
                        <input type="text" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Email *</label>
                        <input type="email" required>
                    </div>
                    <div class="form-group">
                        <label>Phone</label>
                        <input type="tel">
                    </div>
                </div>

                <div class="form-group full-width">
                    <label>Message</label>
                    <textarea rows="4" placeholder="Write your message here..."></textarea>
                </div>

                <button type="submit" class="btn-submit">Submit</button>
            </form>
        </div>
    </div>
</section>
